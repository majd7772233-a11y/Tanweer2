name: Build Android

on:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test · assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore (optional)
        env:
          TANWEER_KEYSTORE_BASE64: ${{ secrets.TANWEER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TANWEER_KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$TANWEER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/tanweer-release.jks"
            echo "TANWEER_KEYSTORE_PATH=$RUNNER_TEMP/keystore/tanweer-release.jks" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No release keystore configured yet — the release APK will be unsigned."
          fi

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          TANWEER_KEYSTORE_PASSWORD: ${{ secrets.TANWEER_KEYSTORE_PASSWORD }}
          TANWEER_KEY_ALIAS: ${{ secrets.TANWEER_KEY_ALIAS }}
          TANWEER_KEY_PASSWORD: ${{ secrets.TANWEER_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tanweer-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
