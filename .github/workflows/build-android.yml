name: Build Android

on:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test · assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore (optional)
        env:
          TANWEER_KEYSTORE_BASE64: ${{ secrets.TANWEER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TANWEER_KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$TANWEER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/tanweer-release.jks"
            echo "TANWEER_KEYSTORE_PATH=$RUNNER_TEMP/keystore/tanweer-release.jks" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No release keystore configured yet — the release APK will be unsigned."
          fi

      - name: Unit tests
        run: |
          set +e
          gradle test --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # نُلخّص أخطاء الترجمة في ملخّص التشغيل وفي تعليقات على الـPR، حتى يراها
            # من لا يفتح سجلات Actions الكاملة.
            while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done < <(grep -E '^(e: |w: )|error:|FAILURE:|Caused by:|Execution failed' "$RUNNER_TEMP/gradle-test.log" | head -20)
            {
              echo '### فشل `gradle test`'
              echo ''
              echo '```text'
              grep -E '^(e: |w: )|error:|FAILURE:|Caused by:|Execution failed|What went wrong' "$RUNNER_TEMP/gradle-test.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Assemble release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done < <(grep -E '^(e: |w: )|error:|FAILURE:|Caused by:|Execution failed' "$RUNNER_TEMP/gradle-assemble.log" | head -20)
            {
              echo '### فشل `gradle assembleRelease`'
              echo ''
              echo '```text'
              grep -E '^(e: |w: )|error:|FAILURE:|Caused by:|Execution failed|What went wrong' "$RUNNER_TEMP/gradle-assemble.log" | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
        env:
          TANWEER_KEYSTORE_PASSWORD: ${{ secrets.TANWEER_KEYSTORE_PASSWORD }}
          TANWEER_KEY_ALIAS: ${{ secrets.TANWEER_KEY_ALIAS }}
          TANWEER_KEY_PASSWORD: ${{ secrets.TANWEER_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tanweer-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
