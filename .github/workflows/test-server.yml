name: Test server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  workflow_dispatch:

concurrency:
  group: test-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · tests · bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (real workerd + real D1 migrations)
        run: npm test

      - name: Bundle check (no deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/tanweer-dry-run
